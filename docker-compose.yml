services:
  learnix:
    build: .
    image: learnix:latest
    container_name: learnix
    restart: unless-stopped
    ports:
      # Loopback-only: the Cloudflare tunnel reaches the app through
      # localhost; the plaintext origin must not sit on the LAN.
      - "127.0.0.1:8080:8080"
    environment:
      # The server's AI key — the only key; all users' AI traffic runs on it
      # and is metered by per-user token quotas.
      - API_KEY=${API_KEY:-}
      - MODEL=${MODEL:-deepseek/deepseek-v4-flash}
      - BASE_URL=${BASE_URL:-https://openrouter.ai/api/v1}
      # Email of the admin account (enables the /admin quota panel). Register
      # this account yourself before sharing the app.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # Web research for the tutor chat and the quiz pipeline.
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Optional per-stage quiz-generation model overrides (empty = MODEL).
      - QUIZ_RESEARCH_MODEL=${QUIZ_RESEARCH_MODEL:-}
      - QUIZ_AUTHOR_MODEL=${QUIZ_AUTHOR_MODEL:-}
      - QUIZ_REVIEW_MODEL=${QUIZ_REVIEW_MODEL:-}
      # Debug mode: lets clients disable web research for chat and quiz (web=false).
      - DEBUG=${DEBUG:-}
      # IMPORTANT: set a stable secret so sessions survive restarts:
      #   echo "SESSION_SECRET=$(openssl rand -hex 32)" >> .env
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - learnix-data:/data

volumes:
  learnix-data:
